name: Queshan Daily Briefing

# 定时任务已迁移到 Cloudflare Worker（cron 准点，见 ../worker/）。
# GitHub Actions 的 schedule 实测会延迟 2~4 小时，无法保证 07:15 送达，
# 因此这里关闭 cron，只保留手动触发用作应急/调试：
#   Actions -> Queshan Daily Briefing -> Run workflow
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: queshan-daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send briefing
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TZ: Asia/Shanghai
        run: node briefing.js

      # 提交 sent-state.json（当日已发送记录，用于跳过同日后面的补跑点）
      # 并每 30 天写一次 .keepalive，避免公开仓库 60 天无提交被停用定时任务。
      - name: Persist state
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f .keepalive ]; then
            age_days=$(( ( $(date +%s) - $(date -r .keepalive +%s) ) / 86400 ))
          else
            age_days=999
          fi
          if [ "$age_days" -ge 30 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          fi

          git add -A sent-state.json .keepalive 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有需要提交的状态变更。"
            exit 0
          fi
          git commit -m "chore: update briefing state $(date -u +%Y-%m-%d)"
          git push
