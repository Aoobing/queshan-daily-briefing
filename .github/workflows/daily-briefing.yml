name: Queshan Daily Briefing

on:
  schedule:
    # GitHub Actions 使用 UTC；07:15 Asia/Shanghai = 23:15 UTC 前一天
    - cron: '15 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 公开仓库超过 60 天无提交会被 GitHub 自动停用定时工作流，
      # 这里每 30 天写一次 .keepalive 提交来保活。
      - name: Keep workflow alive
        continue-on-error: true
        run: |
          if [ -f .keepalive ]; then
            age_days=$(( ( $(date +%s) - $(date -r .keepalive +%s) ) / 86400 ))
            if [ "$age_days" -lt 30 ]; then
              echo "keepalive 仍然新鲜（${age_days} 天），跳过。"
              exit 0
            fi
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send briefing
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TZ: Asia/Shanghai
        run: node briefing.js